<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Complete Your Profile</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="css/styles.css">

<link rel="stylesheet"
href="css/profile.css">

</head>

<body>

<div class="profile-page">

<div class="profile-card">

<h1>

🏆 Complete Your Championship Profile

</h1>

<p>

Complete your profile and earn

<strong>500 XP</strong>

</p>

<form id="profileForm">

<div class="photo-area">

<img

id="profilePreview"

src="https://placehold.co/150x150?text=Photo"

alt="Profile"

>

<input

type="file"

id="profilePhoto"

accept="image/*"

>

</div>

<input
id="fullName"
placeholder="Full Name">

<input
id="mobile"
placeholder="Mobile Number">

<input
id="college"
placeholder="College">

<input
id="branch"
placeholder="Branch">

<input
id="year"
placeholder="Year / Semester">

<input
id="github"
placeholder="GitHub Username">

<input
id="linkedin"
placeholder="LinkedIn URL">

<input
id="leetcode"
placeholder="LeetCode Username">

<input
id="gfg"
placeholder="GeeksforGeeks Username">

<select id="domain">

<option>

Preferred Domain

</option>

<option>Java Backend</option>

<option>Full Stack Java</option>

<option>AI & Machine Learning</option>

<option>Cloud Computing</option>

<option>Cyber Security</option>

<option>Android</option>

<option>Competitive Programming</option>

</select>

<button

type="submit"

class="btn-primary"

>

Complete Profile (+500 XP)

</button>

</form>

</div>

</div>

<script type="module"
src="js/profile/profile.js">

</script>

</body>

</html>
